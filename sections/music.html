<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JWORLD Music</title><style>body{margin:0;background:#050a12;color:white;font-family:Arial;padding:20px}button,input{padding:12px;border-radius:9px;border:1px solid #345;background:#132238;color:white}h1{color:#ffd21a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{padding:15px;background:#0d1827;border:1px solid #263b55;border-radius:15px}.cover{height:130px;background:linear-gradient(135deg,#142e4d,#7b5b00);border-radius:10px;padding:12px;display:flex;align-items:end;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><button onclick="location.href='../index.html'">⌂ Home</button><h1>JWORLD Music</h1><input id="q" placeholder="Search music, artists or albums…" style="width:80%"><p>Discover songs, albums and artists across JWORLD.</p><div class="grid" id="g"></div><script>const a=[['Midnight Empire','JWORLD Sounds'],['Golden Horizon','Kingdom Choir'],['Street Lights','Empire Beats'],['After Rain','Nova Soul'],['Higher Ground','Grace Voices'],['City Pulse','J-Flow']];function r(x){g.innerHTML=x.map(s=>`<div class="card"><div class="cover">${s[0]}</div><p><b>${s[0]}</b><br>${s[1]}</p><button onclick="alert('Music player ready for '+s[0])">▶ Play</button></div>`).join('')}r(a);q.oninput=()=>r(a.filter(s=>(s[0]+' '+s[1]).toLowerCase().includes(q.value.toLowerCase())))</script></body></html>
