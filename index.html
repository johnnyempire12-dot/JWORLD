<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JWORLD</title>
<style>
:root{--bg:#02070c;--gold:#f4b915;--line:#123b57}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{width:100vw;height:100vh;height:100dvh}
.page{width:100vw;height:100vh;height:100dvh;margin:0;background:#000;display:grid;grid-template-rows:8vh minmax(0,87vh) 5vh;overflow:hidden}
.header,.footer,.side,.mainimg,.panel{position:relative;line-height:0;overflow:hidden}
.header img,.footer img,.side img,.mainimg>img,.panel img{width:100%;height:100%;display:block;object-fit:fill}
.body{min-height:0;display:grid;grid-template-columns:14% minmax(0,86%);align-items:stretch;overflow:hidden}
.side{min-width:0}.main{min-width:0;min-height:0;background:#000;display:grid;grid-template-rows:minmax(0,72%) minmax(0,28%);overflow:hidden}
.mainimg{min-height:0}.bottom-grid{min-height:0;display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:8px;padding:6px 0 4px;overflow:hidden}
.panel{min-width:0;min-height:0}.panel img{border-radius:10px}
.hot{position:absolute;z-index:5;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:6px;touch-action:manipulation}
.hot:focus-visible{outline:2px solid #ffd21a;outline-offset:2px}
/* header */
.h-menu{left:0%;top:0%;width:8%;height:100%;z-index:20}.h-search{left:25.8%;top:5%;width:42%;height:70%}.h-chat{left:72.5%;top:5%;width:4%;height:80%}.h-notify{left:77.8%;top:5%;width:4%;height:80%}.h-download{left:82.8%;top:5%;width:4%;height:80%}.h-cart{left:87.8%;top:5%;width:4%;height:80%}.h-profile{left:92%;top:2%;width:7%;height:90%}
/* sidebar */
.s-home{left:2%;top:1.2%;width:95%;height:4.4%}.s-market{left:2%;top:6%;width:95%;height:4.4%}.s-movies{left:2%;top:10.6%;width:95%;height:4.4%}.s-apps{left:2%;top:15.2%;width:95%;height:4.4%}.s-music{left:2%;top:19.8%;width:95%;height:4.4%}.s-books{left:2%;top:24.4%;width:95%;height:4.4%}.s-files{left:2%;top:29%;width:95%;height:4.4%}.s-community{left:2%;top:33.7%;width:95%;height:4.4%}.s-news{left:2%;top:38.3%;width:95%;height:4.4%}.s-library{left:2%;top:42.9%;width:95%;height:4.4%}.s-account{left:2%;top:47.5%;width:95%;height:4.4%}.s-support{left:2%;top:52.1%;width:95%;height:4.4%}.s-premium{left:5%;top:59.5%;width:90%;height:22%}
/* main */
.m-hero{left:2%;top:1.5%;width:96%;height:31%}.m-cat1{left:2%;top:35%;width:10%;height:9%}.m-cat2{left:13.7%;top:35%;width:10%;height:9%}.m-cat3{left:25.2%;top:35%;width:10%;height:9%}.m-cat4{left:36.7%;top:35%;width:10%;height:9%}.m-cat5{left:48.2%;top:35%;width:10%;height:9%}.m-cat6{left:59.6%;top:35%;width:10%;height:9%}.m-cat7{left:71%;top:35%;width:10%;height:9%}.m-cat8{left:82.3%;top:35%;width:6%;height:9%}.m-cat9{left:88.8%;top:35%;width:5.5%;height:9%}.m-feature1{left:2%;top:52%;width:16%;height:20%}.m-feature2{left:20%;top:52%;width:16%;height:20%}.m-feature3{left:38%;top:52%;width:16%;height:20%}.m-feature4{left:56%;top:52%;width:16%;height:20%}.m-feature5{left:74%;top:52%;width:10%;height:20%}.m-feature6{left:85%;top:52%;width:10%;height:20%}.m-reco{left:2%;top:79%;width:66%;height:19%}.m-watch{left:70%;top:79%;width:28%;height:19%}
.p-community{left:2%;top:2%;width:96%;height:96%}.p-quick{left:2%;top:2%;width:96%;height:96%}.p-premium{left:2%;top:2%;width:96%;height:96%}
.footer-hot{left:15%;top:10%;width:45%;height:80%}
@media(max-width:900px){
  .page{grid-template-rows:7vh minmax(0,89vh) 4vh}
  .body{grid-template-columns:1fr}
  .side{display:none}
  .main{grid-template-rows:minmax(0,70%) minmax(0,30%)}
  .bottom-grid{gap:6px;padding:5px 1% 3px;grid-template-columns:1fr 1fr 1fr}
  .panel:last-child{grid-column:auto}
}
@media(max-width:600px){
  .page{grid-template-rows:7vh minmax(0,90vh) 3vh}
  .main{grid-template-rows:minmax(0,70%) minmax(0,30%)}
  .bottom-grid{grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px 1% 2px}
  .panel img{border-radius:7px}
  .header img{object-fit:fill}
  .footer img{object-fit:fill}
}
.menu-drawer{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.72)}
.menu-drawer.open{display:block}
.menu-card{position:absolute;left:0;top:0;height:100%;width:min(320px,82vw);background:#06111a;border-right:1px solid #d9a900;box-shadow:8px 0 30px rgba(0,0,0,.55);padding:18px 14px;overflow:auto}
.menu-card h2{margin:8px 8px 18px;color:#f4b915;font-size:24px}
.menu-card button{width:100%;margin:4px 0;padding:13px 12px;text-align:left;border:1px solid #17405d;border-radius:8px;background:#0a1b27;color:#fff;font-size:15px}
.menu-card button:hover,.menu-card button:active{border-color:#f4b915;background:#122637}
.menu-close{position:absolute;right:10px;top:10px;width:38px!important;height:38px;padding:0!important;text-align:center!important;font-size:20px!important}
.section-modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px}
.section-modal.open{display:flex}.section-box{width:min(520px,94vw);max-height:80vh;overflow:auto;background:#07131d;border:1px solid #d8a800;border-radius:14px;padding:24px;box-shadow:0 15px 50px rgba(0,0,0,.7)}
.section-box h2{margin:0 0 10px;color:#f4b915}.section-box p{color:#cbd5dc;line-height:1.5}.section-box button{border:1px solid #d8a800;background:#f4b915;color:#111;border-radius:8px;padding:10px 18px;font-weight:700}

.marketplace-view{position:fixed;inset:0;z-index:200;background:#02070c;color:#fff;display:none;flex-direction:column;overflow:hidden}
.marketplace-view.open{display:flex}
.market-head{height:72px;flex:0 0 72px;border-bottom:1px solid #123b57;background:#06111a;display:flex;align-items:center;gap:18px;padding:0 20px}
.market-brand{font-size:20px;color:#f4b915;display:flex;align-items:center;gap:9px;min-width:240px}.market-brand span{font-size:30px}.market-brand b{color:#fff}
.market-back,.market-cart{border:1px solid #1a4d6c;background:#0a1b27;color:#fff;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.market-back{margin-left:auto}.market-cart{border-color:#d8a800}.market-cart b{color:#f4b915;margin-left:5px}
.market-toolbar{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid #0d2b40;background:#04101a}.market-toolbar input{flex:1;min-width:100px;background:#081b29;border:1px solid #1b5576;color:#fff;border-radius:10px;padding:12px 14px;outline:none}.market-toolbar input:focus{border-color:#f4b915}.market-toolbar select{background:#081b29;border:1px solid #1b5576;color:#fff;border-radius:10px;padding:0 12px}
.market-body{overflow:auto;padding:18px 20px 30px;min-height:0}.market-title{display:flex;justify-content:space-between;align-items:end}.market-title h1{margin:0;color:#f4b915;font-size:30px}.market-title p{margin:6px 0 0;color:#9db0bd}.market-title span{color:#8fa6b5}
.market-cats{display:flex;gap:8px;overflow:auto;padding:18px 0 14px}.market-cats button{white-space:nowrap;border:1px solid #17405d;background:#081b29;color:#cbd5dc;border-radius:20px;padding:9px 14px;cursor:pointer}.market-cats button.active,.market-cats button:hover{border-color:#f4b915;color:#111;background:#f4b915}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product-card{background:#07131d;border:1px solid #123b57;border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-height:280px}.product-art{height:125px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#10283a,#09131d)}.product-card:nth-child(3n) .product-art{background:linear-gradient(135deg,#24124a,#09131d)}.product-card:nth-child(4n) .product-art{background:linear-gradient(135deg,#38210b,#09131d)}.product-info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.tag{font-size:11px;color:#f4b915;text-transform:uppercase;letter-spacing:.5px}.product-info h3{font-size:16px;margin:0}.product-info p{font-size:12px;color:#9db0bd;margin:0;min-height:30px}.rating{font-size:12px;color:#ffd21a}.price{font-size:17px;font-weight:800;color:#fff;margin-top:auto}.product-actions{display:flex;gap:7px;margin-top:7px}.product-actions button{flex:1;padding:9px;border-radius:8px;cursor:pointer;font-weight:700}.add{border:1px solid #f4b915;background:#f4b915;color:#111}.buy{border:1px solid #1a5b7f;background:#0b2231;color:#fff}
.market-cart-panel{position:absolute;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:flex-end;padding:0}.market-cart-panel.open{display:flex}.cart-box{height:100%;width:min(430px,92vw);background:#06111a;border-left:1px solid #d8a800;padding:24px;overflow:auto;box-shadow:-15px 0 40px rgba(0,0,0,.5)}.cart-box>button:first-child{float:right;width:36px;height:36px;border-radius:50%;border:1px solid #17405d;background:#0a1b27;color:#fff;font-size:22px}.cart-box h2{color:#f4b915;margin-top:5px}.cart-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #123b57;padding:13px 0}.cart-line small{color:#9db0bd;display:block}.cart-remove{background:none;border:0;color:#ff6b6b;cursor:pointer}.cart-total{font-size:20px;font-weight:800;margin:22px 0;color:#fff}.checkout{width:100%;padding:13px;border:1px solid #f4b915;background:#f4b915;color:#111;border-radius:9px;font-weight:800;cursor:pointer}
@media(max-width:900px){.market-head{height:62px;flex-basis:62px;padding:0 10px;gap:8px}.market-brand{min-width:0;font-size:15px}.market-brand span{font-size:22px}.market-back{margin-left:auto}.market-toolbar{padding:9px 10px;flex-wrap:wrap}.market-toolbar input{flex-basis:100%}.market-toolbar select{height:38px;flex:1}.market-body{padding:13px 10px 24px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-card{min-height:250px}.product-art{height:95px;font-size:40px}.market-title h1{font-size:24px}.market-title p{font-size:12px}}
@media(max-width:430px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-info{padding:9px}.product-info h3{font-size:14px}.product-info p{font-size:11px}.product-actions button{padding:8px 4px;font-size:11px}.market-cart{padding:9px}.market-back{padding:9px}.market-brand b{display:none}}
</style>
</head>
<body>
<div class="menu-drawer" id="menuDrawer"><div class="menu-card"><button class="menu-close" id="menuClose" aria-label="Close menu">×</button><h2>JWORLD</h2><button data-menu="Home">⌂ Home</button><button data-menu="Marketplace">🛒 Marketplace</button><button data-menu="Movies & Series">🎬 Movies & Series</button><button data-menu="Apps & Games">🎮 Apps & Games</button><button data-menu="Music">♫ Music</button><button data-menu="Books">▣ Books</button><button data-menu="Files">▰ Files</button><button data-menu="Communities & Chat">👥 Communities & Chat</button><button data-menu="News">▤ News</button><button data-menu="Library">▱ Library</button><button data-menu="Account">♙ Account</button><button data-menu="Support">? Support</button><button data-menu="JWORLD Premium">♛ JWORLD Premium</button></div></div>
<div class="section-modal" id="sectionModal"><div class="section-box"><h2 id="sectionTitle">JWORLD</h2><p id="sectionText"></p><button id="sectionClose">Close</button></div></div>
<div class="marketplace-view" id="marketplaceView" aria-hidden="true">
  <header class="market-head">
    <div class="market-brand"><span>♛</span><b>JWORLD Marketplace</b></div>
    <button class="market-back" id="marketBack">← Home</button>
    <button class="market-cart" id="marketCart">🛒 Cart <b id="cartCount">0</b></button>
  </header>
  <div class="market-toolbar">
    <input id="marketSearch" type="search" placeholder="Search products, books, apps, files..." autocomplete="off">
    <select id="marketCategory"><option value="all">All categories</option><option>Books</option><option>Apps</option><option>Games</option><option>Files</option><option>Music</option><option>Movies</option></select>
    <select id="marketSort"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option></select>
  </div>
  <div class="market-body">
    <div class="market-title"><div><h1>Marketplace</h1><p>Shop digital products, books, apps, games, music and more.</p></div><span id="resultCount"></span></div>
    <div class="market-cats"><button data-cat="all" class="active">All</button><button data-cat="Books">Books</button><button data-cat="Apps">Apps</button><button data-cat="Games">Games</button><button data-cat="Files">Files</button><button data-cat="Music">Music</button><button data-cat="Movies">Movies</button></div>
    <div class="product-grid" id="productGrid"></div>
  </div>
  <div class="market-cart-panel" id="marketCartPanel" aria-hidden="true">
    <div class="cart-box"><button id="cartClose">×</button><h2>Your Cart</h2><div id="cartItems"></div><div class="cart-total" id="cartTotal"></div><button class="checkout" id="checkoutBtn">Proceed to Checkout →</button></div>
  </div>
</div>

<div class="page">
  <div class="header">
    <img src="assets/header.png" alt="JWORLD header">
    <button class="hot h-menu" data-action="menu" aria-label="Open menu"></button><button class="hot h-search" data-section="Search" aria-label="Search"></button><button class="hot h-chat" data-section="Chat" aria-label="Chat"></button><button class="hot h-notify" data-section="Notifications" aria-label="Notifications"></button><button class="hot h-download" data-section="Downloads" aria-label="Downloads"></button><button class="hot h-cart" data-section="Cart" aria-label="Cart"></button><button class="hot h-profile" data-section="Account" aria-label="Account"></button>
  </div>
  <div class="body">
    <aside class="side">
      <img src="assets/sidebar.png" alt="JWORLD navigation">
      <button class="hot s-home" data-section="Home"></button><button class="hot s-market" data-section="Marketplace"></button><button class="hot s-movies" data-section="Movies & Series"></button><button class="hot s-apps" data-section="Apps & Games"></button><button class="hot s-music" data-section="Music"></button><button class="hot s-books" data-section="Books"></button><button class="hot s-files" data-section="Files"></button><button class="hot s-community" data-section="Communities & Chat"></button><button class="hot s-news" data-section="News"></button><button class="hot s-library" data-section="Library"></button><button class="hot s-account" data-section="Account"></button><button class="hot s-support" data-section="Support"></button><button class="hot s-premium" data-section="JWORLD Premium"></button>
    </aside>
    <main class="main">
      <div class="mainimg">
        <img src="assets/main.png" alt="JWORLD main dashboard">
        <button class="hot m-hero" data-section="Explore"></button>
        <button class="hot m-cat1" data-section="Marketplace"></button><button class="hot m-cat2" data-section="Movies & Series"></button><button class="hot m-cat3" data-section="Apps & Games"></button><button class="hot m-cat4" data-section="Music"></button><button class="hot m-cat5" data-section="Books"></button><button class="hot m-cat6" data-section="Files"></button><button class="hot m-cat7" data-section="Communities & Chat"></button><button class="hot m-cat8" data-section="News"></button><button class="hot m-cat9" data-section="Library"></button>
        <button class="hot m-feature1" data-section="Movies & Series"></button><button class="hot m-feature2" data-section="Apps & Games"></button><button class="hot m-feature3" data-section="Apps & Games"></button><button class="hot m-feature4" data-section="Books"></button><button class="hot m-feature5" data-section="Music"></button><button class="hot m-feature6" data-section="Files"></button>
        <button class="hot m-reco" data-section="Recommended For You"></button><button class="hot m-watch" data-section="Continue Watching"></button>
      </div>
      <div class="bottom-grid">
        <div class="panel"><img src="assets/communities.png" alt="My Communities"><button class="hot p-community" data-section="My Communities" aria-label="My Communities"></button></div>
        <div class="panel"><img src="assets/quick-access.png" alt="Quick Access"><button class="hot p-quick" data-section="Quick Access" aria-label="Quick Access"></button></div>
        <div class="panel"><img src="assets/premium.png" alt="JWORLD Premium"><button class="hot p-premium" data-section="JWORLD Premium" aria-label="JWORLD Premium"></button></div>
      </div>
    </main>
  </div>
  <div class="footer"><img src="assets/footer.png" alt="JWORLD footer"></div>
</div>
<script>
const drawer=document.getElementById('menuDrawer');
const modal=document.getElementById('sectionModal');
const titleEl=document.getElementById('sectionTitle');
const textEl=document.getElementById('sectionText');
function openSection(section){
  if(section==='Home'){location.hash=''; modal.classList.remove('open'); marketplaceView.classList.remove('open'); marketplaceView.setAttribute('aria-hidden','true'); return;}
  if(section==='Marketplace'){modal.classList.remove('open'); marketplaceView.classList.add('open'); marketplaceView.setAttribute('aria-hidden','false'); location.hash='Marketplace'; renderProducts(); return;}
  location.hash=encodeURIComponent(section);
  titleEl.textContent=section;
  textEl.textContent=section+' is ready to open in JWORLD. This clickable home-screen control is now connected.';
  modal.classList.add('open');
}
document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.action==='menu'){drawer.classList.add('open'); return;}
  openSection(b.dataset.section||'Home');
}));
document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>{drawer.classList.remove('open');openSection(b.dataset.menu);}));
document.getElementById('menuClose').addEventListener('click',()=>drawer.classList.remove('open'));
drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});
document.getElementById('sectionClose').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});


const marketplaceView=document.getElementById('marketplaceView');
const productGrid=document.getElementById('productGrid');
const marketSearch=document.getElementById('marketSearch');
const marketCategory=document.getElementById('marketCategory');
const marketSort=document.getElementById('marketSort');
const resultCount=document.getElementById('resultCount');
const cartCount=document.getElementById('cartCount');
const cartPanel=document.getElementById('marketCartPanel');
const cartItems=document.getElementById('cartItems');
const cartTotal=document.getElementById('cartTotal');
const products=[
 {id:1,name:'Atomic Habits',cat:'Books',price:10000,rating:4.8,icon:'📚',desc:'Practical personal-growth book.'},
 {id:2,name:'AI Photo Editor Pro',cat:'Apps',price:4500,rating:4.7,icon:'📱',desc:'Powerful photo editing tools.'},
 {id:3,name:'Windows 11 Pro',cat:'Files',price:8500,rating:4.5,icon:'🪟',desc:'Digital software license.'},
 {id:4,name:'Good Vibes Only',cat:'Music',price:2500,rating:4.6,icon:'🎵',desc:'Chill music collection.'},
 {id:5,name:'Modern Warfare III',cat:'Games',price:12000,rating:4.6,icon:'🎮',desc:'Action shooter experience.'},
 {id:6,name:'The Batman',cat:'Movies',price:3000,rating:4.8,icon:'🎬',desc:'Action thriller movie.'},
 {id:7,name:'The 7 Habits',cat:'Books',price:9000,rating:4.6,icon:'📖',desc:'Classic personal development.'},
 {id:8,name:'Study Music Playlist',cat:'Music',price:1800,rating:4.6,icon:'🎧',desc:'Focus and study playlist.'}
];
let cart=[];
function naira(n){return '₦'+n.toLocaleString('en-NG')}
function renderProducts(){
 let q=marketSearch.value.trim().toLowerCase(), cat=marketCategory.value;
 let list=products.filter(p=>(!q||(p.name+' '+p.cat+' '+p.desc).toLowerCase().includes(q))&&(cat==='all'||p.cat===cat));
 if(marketSort.value==='low')list.sort((a,b)=>a.price-b.price); if(marketSort.value==='high')list.sort((a,b)=>b.price-a.price); if(marketSort.value==='rating')list.sort((a,b)=>b.rating-a.rating);
 resultCount.textContent=list.length+' products';
 productGrid.innerHTML=list.map(p=>`<article class="product-card"><div class="product-art">${p.icon}</div><div class="product-info"><span class="tag">${p.cat}</span><h3>${p.name}</h3><p>${p.desc}</p><div class="rating">★ ${p.rating}</div><div class="price">${naira(p.price)}</div><div class="product-actions"><button class="add" data-add="${p.id}">Add to Cart</button><button class="buy" data-buy="${p.id}">Buy Now</button></div></div></article>`).join('')||'<p>No products found.</p>';
}
function updateCart(){
 cartCount.textContent=cart.length;
 cartItems.innerHTML=cart.length?cart.map((p,i)=>`<div class="cart-line"><div><b>${p.name}</b><small>${p.cat} · ${naira(p.price)}</small></div><button class="cart-remove" data-remove="${i}">Remove</button></div>`).join(''):'<p style="color:#9db0bd">Your cart is empty.</p>';
 cartTotal.textContent='Total: '+naira(cart.reduce((s,p)=>s+p.price,0));
}
productGrid.addEventListener('click',e=>{const add=e.target.closest('[data-add]'),buy=e.target.closest('[data-buy]');const id=Number((add||buy)?.dataset[(add?'add':'buy')]);if(!id)return;const p=products.find(x=>x.id===id);if(buy){cart.push(p);updateCart();cartPanel.classList.add('open');}else{cart.push(p);updateCart();}});
cartItems.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){cart.splice(Number(b.dataset.remove),1);updateCart();}});
document.getElementById('marketCart').addEventListener('click',()=>{updateCart();cartPanel.classList.add('open')});
document.getElementById('cartClose').addEventListener('click',()=>cartPanel.classList.remove('open'));
document.getElementById('marketBack').addEventListener('click',()=>openSection('Home'));
marketSearch.addEventListener('input',renderProducts);marketCategory.addEventListener('change',renderProducts);marketSort.addEventListener('change',renderProducts);
document.querySelectorAll('.market-cats button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.market-cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');marketCategory.value=b.dataset.cat;renderProducts()}));
document.getElementById('checkoutBtn').addEventListener('click',()=>{if(!cart.length){alert('Your cart is empty.');return}alert('Checkout is ready to connect to your payment provider.');});
</script>
</body>
</html>
