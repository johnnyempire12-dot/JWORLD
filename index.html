<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JWORLD Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#fff;font-family:Arial,sans-serif}
header{height:68px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#081321;border-bottom:1px solid #24354b;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;color:#ffd21a}.home{background:#17263a;color:#fff;border:1px solid #334b68;border-radius:10px;padding:10px 14px;cursor:pointer}
.search{flex:1;max-width:650px;margin:auto;background:#101d2d;border:1px solid #344c68;color:#fff;border-radius:12px;padding:12px 15px;outline:none}
main{max-width:1250px;margin:auto;padding:22px 16px 100px}.hero{padding:24px;border-radius:18px;background:linear-gradient(110deg,#111f35,#10131d);border:1px solid #293c56}
h1{margin:0 0 6px;font-size:30px}.muted{color:#a9b7c9}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;padding:10px 15px;border-radius:999px;background:#111f31;color:#dce7f3;border:1px solid #30445e;cursor:pointer}.tab.active{background:#ffd21a;color:#111;border-color:#ffd21a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#0d1827;border:1px solid #263b55;border-radius:15px;padding:13px}.cover{height:145px;border-radius:11px;background:linear-gradient(135deg,#142e4d,#7b5b00);display:flex;align-items:end;padding:12px;font-weight:800;font-size:18px}.meta{margin-top:9px}.artist{color:#9eafc3;font-size:13px}.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;border:0;border-radius:9px;padding:9px;cursor:pointer;background:#17283e;color:#fff}.play{background:#ffd21a;color:#111;font-weight:800}
.player{position:fixed;bottom:0;left:0;right:0;background:#091422;border-top:1px solid #30465f;padding:10px 15px;display:flex;align-items:center;gap:12px;z-index:8}.now{min-width:150px}.bar{flex:1;height:6px;background:#26384d;border-radius:9px;overflow:hidden}.fill{height:100%;width:28%;background:#ffd21a}.controls button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header{height:62px}.logo{font-size:21px}.home{padding:9px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.cover{height:120px}.now{min-width:105px}.search{max-width:none}}
</style>
</head>
<body>
<header>
  <button class="home" onclick="location.href='index.html'">⌂ Home</button>
  <div class="logo">JWORLD</div>
  <input id="search" class="search" placeholder="Search music, artists or albums…">
</header>
<main>
<section class="hero">
<h1>Music</h1><div class="muted">Discover songs, albums and artists across JWORLD.</div>
</section>
<div class="tabs" id="tabs">
<button class="tab active" data-filter="all">All</button><button class="tab" data-filter="trending">Trending</button>
<button class="tab" data-filter="afrobeats">Afrobeats</button><button class="tab" data-filter="gospel">Gospel</button>
<button class="tab" data-filter="hiphop">Hip-Hop</button><button class="tab" data-filter="podcast">Podcasts</button>
</div>
<div class="grid" id="grid"></div>
</main>
<div class="player"><div class="now"><b id="now">Nothing playing</b><div class="artist" id="nowArtist">Choose a song</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="controls"><button onclick="prev()">⏮</button><button onclick="toggle()" id="toggle">▶</button><button onclick="next()">⏭</button></div></div>
<script>
const songs=[
["Midnight Empire","JWORLD Sounds","afrobeats","trending"],["Golden Horizon","Kingdom Choir","gospel","trending"],
["Street Lights","Empire Beats","hiphop","trending"],["After Rain","Nova Soul","afrobeats",""],
["Higher Ground","Grace Voices","gospel",""],["City Pulse","J-Flow","hiphop",""],
["The Journey","JWORLD Originals","podcast",""],["Night Drive","Kairo","afrobeats",""]
];
let list=songs.map((x,i)=>({name:x[0],artist:x[1],cat:x[2],tag:x[3],i})), current=-1, playing=false;
function render(items=list){grid.innerHTML=items.map((s,k)=>`<article class="card"><div class="cover">${s.name}</div><div class="meta"><b>${s.name}</b><div class="artist">${s.artist}</div></div><div class="row"><button class="btn play" onclick="play(${s.i})">▶ Play</button><button class="btn" onclick="alert('Added to your JWORLD Library')">＋</button></div></article>`).join("")}
function play(i){current=list.findIndex(s=>s.i===i); if(current<0)return; playing=true; now.textContent=list[current].name; nowArtist.textContent=list[current].artist; toggle.textContent="Ⅱ"; fill.style.width="35%"}
function toggle(){if(current<0)return;playing=!playing;toggle.textContent=playing?"Ⅱ":"▶"}
function prev(){if(!list.length)return;current=(current<=0?list.length-1:current-1);play(list[current].i)}
function next(){if(!list.length)return;current=(current+1)%list.length;play(list[current].i)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");let f=t.dataset.filter;render(f==="all"?list:list.filter(s=>s.cat===f||s.tag===f))});
search.oninput=()=>{let q=search.value.toLowerCase();render(list.filter(s=>(s.name+" "+s.artist+" "+s.cat).toLowerCase().includes(q)))};
render();
</script>
</body>
</html>
