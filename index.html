<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JWORLD</title>
<style>
:root{--bg:#02070c;--gold:#f4b915;--line:#123b57}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}
.page{width:min(1536px,100vw);margin:0 auto;background:#000}
.header{position:relative;width:100%;line-height:0}.header img{width:100%;height:auto;display:block}.body{display:grid;grid-template-columns:211px minmax(0,1fr);align-items:start}.side{position:relative;line-height:0}.side img{width:100%;height:auto;display:block}.main{min-width:0;background:#000;padding:0 0 0 0}.mainimg{position:relative;line-height:0}.mainimg>img{width:100%;height:auto;display:block}.bottom-grid{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:10px;padding:10px 0 10px}.panel{position:relative;line-height:0;min-width:0}.panel img{width:100%;height:auto;display:block;border-radius:10px}.footer{position:relative;line-height:0}.footer img{width:100%;height:auto;display:block}
.hot{position:absolute;z-index:5;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:6px}.hot:focus-visible{outline:2px solid #ffd21a;outline-offset:2px}
/* header */
.h-search{left:25.8%;top:5%;width:42%;height:70%}.h-chat{left:72.5%;top:5%;width:4%;height:80%}.h-notify{left:77.8%;top:5%;width:4%;height:80%}.h-download{left:82.8%;top:5%;width:4%;height:80%}.h-cart{left:87.8%;top:5%;width:4%;height:80%}.h-profile{left:92%;top:2%;width:7%;height:90%}
/* sidebar, relative to 211x899 crop */
.s-home{left:2%;top:1.2%;width:95%;height:4.4%}.s-market{left:2%;top:6.0%;width:95%;height:4.4%}.s-movies{left:2%;top:10.6%;width:95%;height:4.4%}.s-apps{left:2%;top:15.2%;width:95%;height:4.4%}.s-music{left:2%;top:19.8%;width:95%;height:4.4%}.s-books{left:2%;top:24.4%;width:95%;height:4.4%}.s-files{left:2%;top:29.0%;width:95%;height:4.4%}.s-community{left:2%;top:33.7%;width:95%;height:4.4%}.s-news{left:2%;top:38.3%;width:95%;height:4.4%}.s-library{left:2%;top:42.9%;width:95%;height:4.4%}.s-account{left:2%;top:47.5%;width:95%;height:4.4%}.s-support{left:2%;top:52.1%;width:95%;height:4.4%}.s-premium{left:5%;top:59.5%;width:90%;height:22%}
/* main crop: original x=211..1230, y=67..866 */
.m-hero{left:2%;top:1.5%;width:96%;height:31%}.m-cat1{left:2%;top:35%;width:10%;height:9%}.m-cat2{left:13.7%;top:35%;width:10%;height:9%}.m-cat3{left:25.2%;top:35%;width:10%;height:9%}.m-cat4{left:36.7%;top:35%;width:10%;height:9%}.m-cat5{left:48.2%;top:35%;width:10%;height:9%}.m-cat6{left:59.6%;top:35%;width:10%;height:9%}.m-cat7{left:71%;top:35%;width:10%;height:9%}.m-cat8{left:82.3%;top:35%;width:6%;height:9%}.m-cat9{left:88.8%;top:35%;width:5.5%;height:9%}.m-feature1{left:2%;top:52%;width:16%;height:20%}.m-feature2{left:20%;top:52%;width:16%;height:20%}.m-feature3{left:38%;top:52%;width:16%;height:20%}.m-feature4{left:56%;top:52%;width:16%;height:20%}.m-feature5{left:74%;top:52%;width:10%;height:20%}.m-feature6{left:85%;top:52%;width:10%;height:20%}.m-reco{left:2%;top:79%;width:66%;height:19%}.m-watch{left:70%;top:79%;width:28%;height:19%}
/* bottom panels */
.p-community{left:2%;top:2%;width:96%;height:96%}.p-quick{left:2%;top:2%;width:96%;height:96%}.p-premium{left:2%;top:2%;width:96%;height:96%}
.footer-hot{left:15%;top:10%;width:45%;height:80%}
@media(max-width:900px){.body{grid-template-columns:145px minmax(0,1fr)}.bottom-grid{grid-template-columns:1fr 1fr;}.panel:last-child{grid-column:1/-1}.s-premium{top:59%;height:21%}}
@media(max-width:600px){.body{grid-template-columns:1fr}.side{display:none}.bottom-grid{grid-template-columns:1fr;gap:8px;padding:8px}.panel:last-child{grid-column:auto}.header img{min-height:58px;object-fit:cover}.mainimg>img{width:100%}.hot{touch-action:manipulation}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img src="assets/header.png" alt="JWORLD header">
    <button class="hot h-search" data-section="Search" aria-label="Search"></button><button class="hot h-chat" data-section="Chat" aria-label="Chat"></button><button class="hot h-notify" data-section="Notifications" aria-label="Notifications"></button><button class="hot h-download" data-section="Downloads" aria-label="Downloads"></button><button class="hot h-cart" data-section="Cart" aria-label="Cart"></button><button class="hot h-profile" data-section="Account" aria-label="Account"></button>
  </div>
  <div class="body">
    <aside class="side">
      <img src="assets/sidebar.png" alt="JWORLD navigation">
      <button class="hot s-home" data-section="Home"></button><button class="hot s-market" data-section="Marketplace"></button><button class="hot s-movies" data-section="Movies & Series"></button><button class="hot s-apps" data-section="Apps & Games"></button><button class="hot s-music" data-section="Music"></button><button class="hot s-books" data-section="Books"></button><button class="hot s-files" data-section="Files"></button><button class="hot s-community" data-section="Communities & Chat"></button><button class="hot s-news" data-section="News"></button><button class="hot s-library" data-section="Library"></button><button class="hot s-account" data-section="Account"></button><button class="hot s-support" data-section="Support"></button><button class="hot s-premium" data-section="JWORLD Premium"></button>
    </aside>
    <main class="main">
      <div class="mainimg">
        <img src="assets/main.png" alt="JWORLD main dashboard">
        <button class="hot m-hero" data-section="Explore"></button>
        <button class="hot m-cat1" data-section="Marketplace"></button><button class="hot m-cat2" data-section="Movies & Series"></button><button class="hot m-cat3" data-section="Apps & Games"></button><button class="hot m-cat4" data-section="Music"></button><button class="hot m-cat5" data-section="Books"></button><button class="hot m-cat6" data-section="Files"></button><button class="hot m-cat7" data-section="Communities & Chat"></button><button class="hot m-cat8" data-section="News"></button><button class="hot m-cat9" data-section="Library"></button>
        <button class="hot m-feature1" data-section="Movies & Series"></button><button class="hot m-feature2" data-section="Apps & Games"></button><button class="hot m-feature3" data-section="Apps & Games"></button><button class="hot m-feature4" data-section="Books"></button><button class="hot m-feature5" data-section="Music"></button><button class="hot m-feature6" data-section="Files"></button>
        <button class="hot m-reco" data-section="Recommended For You"></button><button class="hot m-watch" data-section="Continue Watching"></button>
      </div>
      <div class="bottom-grid">
        <div class="panel"><img src="assets/communities.png" alt="My Communities"><button class="hot p-community" data-section="My Communities" aria-label="My Communities"></button></div>
        <div class="panel"><img src="assets/quick-access.png" alt="Quick Access"><button class="hot p-quick" data-section="Quick Access" aria-label="Quick Access"></button></div>
        <div class="panel"><img src="assets/premium.png" alt="JWORLD Premium"><button class="hot p-premium" data-section="JWORLD Premium" aria-label="JWORLD Premium"></button></div>
      </div>
    </main>
  </div>
  <div class="footer"><img src="assets/footer.png" alt="JWORLD footer"></div>
</div>
<script>
const page=document.querySelector('.page');
function go(section){
  if(section==='Home'){location.hash='';return;}
  const title=encodeURIComponent(section); location.hash=title;
  alert(section+' — ready to open');
}
document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',()=>go(b.dataset.section||'Home')));
</script>
</body>
</html>
