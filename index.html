<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JWORLD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#home{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#stage{
  position:relative;
  width:100%;
  height:100%;
  max-width:100vw;
  max-height:100dvh;
  overflow:hidden;
  background:#000;
}
#hero{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.zone{
  position:absolute;
  display:block;
  z-index:10;
  cursor:pointer;
  background:transparent;
  border:0;
  padding:0;
}
.zone:focus-visible{
  outline:2px solid #ffd21a;
  outline-offset:2px;
  border-radius:8px;
}
#status{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:30;
  display:none;
  background:#07111a;
  color:#fff;
  border:1px solid #d8a800;
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
}
@media (max-width:600px){
  #hero{object-fit:contain}
}
</style>
</head>
<body>
<main id="home">
  <div id="stage">
    <img id="hero" src="assets/jworld-home.png" alt="JWORLD home screen">

    <!-- Left navigation -->
    <button class="zone" style="left:1.5%;top:12.8%;width:11.0%;height:4.0%" data-section="Home" aria-label="Home"></button>
    <button class="zone" style="left:1.5%;top:18.1%;width:11.0%;height:4.0%" data-section="Marketplace" aria-label="Marketplace"></button>
    <button class="zone" style="left:1.5%;top:23.0%;width:11.0%;height:4.0%" data-section="Movies & Series" aria-label="Movies and Series"></button>
    <button class="zone" style="left:1.5%;top:27.8%;width:11.0%;height:4.0%" data-section="Apps & Games" aria-label="Apps and Games"></button>
    <button class="zone" style="left:1.5%;top:32.6%;width:11.0%;height:4.0%" data-section="Music" aria-label="Music"></button>
    <button class="zone" style="left:1.5%;top:37.4%;width:11.0%;height:4.0%" data-section="Books" aria-label="Books"></button>
    <button class="zone" style="left:1.5%;top:42.2%;width:11.0%;height:4.0%" data-section="Files" aria-label="Files"></button>
    <button class="zone" style="left:1.5%;top:47.0%;width:11.0%;height:4.0%" data-section="Communities & Chat" aria-label="Communities and Chat"></button>
    <button class="zone" style="left:1.5%;top:51.8%;width:11.0%;height:4.0%" data-section="News" aria-label="News"></button>
    <button class="zone" style="left:1.5%;top:56.6%;width:11.0%;height:4.0%" data-section="Library" aria-label="Library"></button>
    <button class="zone" style="left:1.5%;top:61.4%;width:11.0%;height:4.0%" data-section="Account" aria-label="Account"></button>
    <button class="zone" style="left:1.5%;top:66.2%;width:11.0%;height:4.0%" data-section="Support" aria-label="Support"></button>

    <!-- Header -->
    <button class="zone" style="left:25.8%;top:2.0%;width:42.0%;height:5.0%" data-section="Search" aria-label="Search"></button>

    <button class="zone" style="left:94.5%;top:1.0%;width:5.0%;height:7.0%" data-section="Account" aria-label="Profile"></button>

    <!-- Main banner -->

    <button class="zone" style="left:60.5%;top:34.0%;width:7.0%;height:8.0%" data-section="Communities & Chat"></button>

    <button class="zone" style="left:75.5%;top:34.0%;width:7.0%;height:8.0%" data-section="Library"></button>

    <button class="zone" style="left:76%;top:43%;width:15%;height:17%" data-section="Good Vibes Only"></button>

    <button class="zone" style="left:16%;top:69%;width:20%;height:10%" data-section="Creator / Seller"></button>
    <button class="zone" style="left:38%;top:69%;width:20%;height:10%" data-section="Communities & Chat"></button>
    <button class="zone" style="left:60%;top:69%;width:20%;height:10%" data-section="JWORLD App"></button>

    <!-- Right sidebar -->

    <button class="zone" style="left:67%;top:93%;width:8%;height:4%" data-section="Privacy Policy"></button>
    <button class="zone" style="left:77%;top:93%;width:9%;height:4%" data-section="Terms of Service"></button>
  </div>
</main>
<div id="status"></div>

<script>
const statusBox = document.getElementById('status');
document.querySelectorAll('.zone').forEach(zone => {
  zone.addEventListener('click', () => {
    const section = zone.dataset.section || 'Home';
    if (section === 'Home') {
      window.scrollTo(0,0);
      return;
    }
    // Placeholder navigation until the real section pages are connected.
    statusBox.textContent = section + ' — section ready to connect';
    statusBox.style.display = 'block';
    clearTimeout(window.__statusTimer);
    window.__statusTimer = setTimeout(() => statusBox.style.display='none', 1800);
  });
});
</script>
</body>
</html>
